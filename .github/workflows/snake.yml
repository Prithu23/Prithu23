# Save this as:  .github/workflows/snake.yml  in your profile repo
name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"   # runs twice a day, automatically
  workflow_dispatch:          # lets you run it manually the first time
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-dark&color_snake=58A6FF&color_dots=0D1117,1F6FEB,2563EB,58A6FF,9BD1FF

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
